      - name: Build
        working-directory: ./client
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          OUTPUT="standalone-sstp-proxy-client-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}"

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "../$OUTPUT" .

      - name: Package
        run: |
          BINARY="standalone-sstp-proxy-client-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}"

          if [ "${{ matrix.goos }}" = "linux" ]; then
            ARCHIVE="standalone-sstp-proxy-client-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
            tar -czf "$ARCHIVE" "$BINARY"
          else
            ARCHIVE="standalone-sstp-proxy-client-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
            zip "$ARCHIVE" "$BINARY"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            standalone-sstp-proxy-client-${{ matrix.goos }}-${{ matrix.goarch }}.*

# ...

      - name: Upload files to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release-files/*.tar.gz \
            release-files/*.zip \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"
