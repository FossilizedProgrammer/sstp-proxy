name: Build and Release

on:
  push:
    tags:
      - "1.0.0"
  workflow_dispatch:    # این خط اجازه می‌ده دستی اجرا کنی

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: ""

          - goos: windows
            goarch: amd64
            extension: ".exe"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: client/go.sum

      - name: Download dependencies
        working-directory: ./client
        run: go mod download

      - name: Run tests
        working-directory: ./client
        run: go test ./...

      - name: Build
        working-directory: ./client
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          OUTPUT="standalone-sstp-proxy-client-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}"

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "../$OUTPUT" .

      - name: Package
        run: |
          BINARY="standalone-sstp-proxy-client-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}"

          if [ "${{ matrix.goos }}" = "linux" ]; then
            ARCHIVE="standalone-sstp-proxy-client-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
            tar -czf "$ARCHIVE" "$BINARY"
          else
            ARCHIVE="standalone-sstp-proxy-client-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
            zip "$ARCHIVE" "$BINARY"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip

  release:
    name: Create release and upload files
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')   # فقط وقتی تگ باشه ریلیز بسازه

    steps:
      - name: Download build files
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then

            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

      - name: Upload files to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release-files/*.tar.gz \
            release-files/*.zip \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"
